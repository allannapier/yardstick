experiment: interactive-sonnet-01
question: >
  Ad-hoc arm for routing an interactive Claude Code session through the ys
  proxy against the real claude-sonnet-5 model (spends real API budget --
  kept separate from example.yaml's mock smoke test on purpose).

task:
  id: interactive-000
  success_check: "true"
  timeout_s: 3600

factors:
  agent: [claude-code]
  model: [claude-sonnet-5]

models:
  claude-sonnet-5:
    model: claude-sonnet-5
    api_key: os.environ/ANTHROPIC_API_KEY

# claude-sonnet-5 is not a real, published model id -- LiteLLM's cost map has
# no entry for it, so response_cost comes back 0.0 on every request despite
# real token usage (finding 9 in IMPROVEMENTS.md, reproduced against this
# exact file). Declaring prices here (illustrative list-price-shaped numbers;
# replace with your actual contract pricing) lets ys/collector.py compute
# cost_usd from tokens instead of silently reporting $0. Keyed exactly like
# `models` above, by the `factors.model` value.
pricing:
  claude-sonnet-5:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cache_write_per_mtok: 3.75
    cache_read_per_mtok: 0.30

arms:
  - id: arm-sonnet
    factors: {agent: claude-code, model: claude-sonnet-5}
    notes: "real Sonnet 5 -- spends real API budget"
    baseline: true

repeats: 1

metrics:
  gate: task_success
  primary: [cost_usd, billable_tokens, turns, wall_clock_s]
  secondary: [tool_calls, redundant_tool_calls, tool_error_rate, cache_read_ratio, fixed_overhead_tokens, context_high_water, compaction_events]
  derived: [cost_per_success, tokens_per_turn]
