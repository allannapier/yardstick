[project]
name = "yardstick"
version = "0.1.0"
description = "Agent/Harness/Model efficiency measurement rig"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "litellm[proxy]>=1.93.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ys = "ys.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ys*"]

[tool.ruff.lint]
# Pyflakes plus the syntax-error/fatal subset of pycodestyle -- this is the
# baseline that would have caught the ys/render.py f-string SyntaxError
# (finding 1). Ruff's larger opt-in rule families (S, ASYNC, PL, RUF, UP, ...)
# raise real style/security findings but are a separate remediation project,
# not part of standing up CI.
select = ["E4", "E7", "E9", "F"]
